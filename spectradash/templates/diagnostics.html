{% extends "base.html" %}
{% block content %}
<section class="panel"><h1>Diagnostics</h1><div id="diag" class="diag">Loading…</div></section>
<script>
fetch('/api/diagnostics').then(r=>r.json()).then(d=>{
 const box=document.getElementById('diag'); box.innerHTML='';
 Object.entries(d).forEach(([k,v])=>{const x=document.createElement('div');x.innerHTML=`<span>${k.replaceAll('_',' ')}</span><strong>${v}</strong>`;box.appendChild(x);});
});
</script>
{% endblock %}
