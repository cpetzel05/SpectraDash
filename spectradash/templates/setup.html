{% extends "base.html" %}
{% block title %}Setup — SpectraDash{% endblock %}
{% block content %}
<section class="panel">
<h1>Setup Wizard</h1>
<div class="search">
<input id="query" value="{{ config.location_query }}" placeholder="ZIP code or city">
<button type="button" onclick="lookup()">Search</button>
</div>
<div id="results"></div>
<form method="post" class="form-grid">
<label>Search value<input name="location_query" value="{{ config.location_query }}"></label>
<label>Location label<input id="location_name" name="location_name" value="{{ config.location_name }}"></label>
<label>Latitude<input id="latitude" type="number" step="any" name="latitude" value="{{ config.latitude }}"></label>
<label>Longitude<input id="longitude" type="number" step="any" name="longitude" value="{{ config.longitude }}"></label>
<label>Units<select name="units"><option value="imperial" {% if config.units=="imperial" %}selected{% endif %}>Imperial</option><option value="metric" {% if config.units=="metric" %}selected{% endif %}>Metric</option></select></label>
<label>Layout<select name="layout"><option value="weather-station" {% if config.layout=="weather-station" %}selected{% endif %}>Weather Station</option><option value="premium-lcd" {% if config.layout=="premium-lcd" %}selected{% endif %}>Premium LCD</option></select></label>
<label>Theme<select name="theme">{% for t in ["light","dark","ocean","desert","high-contrast"] %}<option value="{{ t }}" {% if config.theme==t %}selected{% endif %}>{{ t|title }}</option>{% endfor %}</select></label>
<label>Display profile<select name="display_profile"><option value="preview" {% if config.display_profile=="preview" %}selected{% endif %}>Preview only</option><option value="waveshare-13in3e" {% if config.display_profile=="waveshare-13in3e" %}selected{% endif %}>Waveshare 13.3 E</option></select></label>
<label>Refresh minutes<input type="number" min="3" name="refresh_minutes" value="{{ config.refresh_minutes }}"></label>
<label class="check"><input type="checkbox" name="auto_refresh" {% if config.auto_refresh %}checked{% endif %}>Automatic refresh</label>
<button class="primary">Save Configuration</button>
</form>
<form method="post" action="/backup"><button>Back Up Configuration</button></form>
</section>
<script>
async function lookup(){
 const q=document.getElementById('query').value;
 const box=document.getElementById('results');
 box.textContent='Searching...';
 const rows=await fetch('/api/location-search?q='+encodeURIComponent(q)).then(r=>r.json());
 box.innerHTML='';
 rows.forEach(row=>{
  const b=document.createElement('button');
  b.type='button'; b.className='result';
  b.textContent=`${row.label} (${row.latitude}, ${row.longitude})`;
  b.onclick=()=>{
   document.getElementById('location_name').value=row.label;
   document.getElementById('latitude').value=row.latitude;
   document.getElementById('longitude').value=row.longitude;
   box.innerHTML='';
  };
  box.appendChild(b);
 });
 if(!rows.length) box.textContent='No results found.';
}
</script>
{% endblock %}
