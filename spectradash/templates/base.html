<!doctype html>
<html lang="en" data-theme="{{ config.theme }}">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}SpectraDash{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<aside>
<div class="brand">SpectraDash</div>
<a href="/">Dashboard</a>
<a href="/setup">Setup Wizard</a>
<a href="/preview">Display Preview</a>
<a href="/diagnostics">Diagnostics</a>
<a href="/api/weather">Weather API</a>
</aside>
<div class="page">
<header><strong>{{ weather.location if weather else "SpectraDash" }}</strong><span>v1.0.0-rc1</span></header>
<main>
{% with messages = get_flashed_messages() %}{% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}{% endwith %}
{% block content %}{% endblock %}
</main>
</div>
</body>
</html>
