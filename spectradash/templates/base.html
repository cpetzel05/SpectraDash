<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14213d">
  <title>{% block title %}SpectraDash{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('dashboard') }}"><span class="brand-mark">S6</span><span>SpectraDash</span></a>
  <nav><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('settings') }}">Settings</a><a href="{{ url_for('theme_gallery') }}">Themes</a><a href="{{ url_for('designer') }}">Screen Designer</a><a href="{{ url_for('plugins_page') }}">Plugins</a><a href="{{ url_for('diagnostics') }}">Diagnostics</a>{% if config is defined and config.developer_mode %}<a href="{{ url_for('developer') }}">Developer</a>{% endif %}</nav>
  <span class="version">v{{ version }}</span>
</header>
<main>{% block content %}{% endblock %}</main>
{% block scripts %}{% endblock %}
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
