[project]
name = "spectradash"
version = "8.0.0rc18.post2"
description = "Responsive Raspberry Pi e-paper weather dashboard"
requires-python = ">=3.11"
dependencies = [
  "Flask==3.1.1",
  "gunicorn==23.0.0",
  "requests==2.32.4",
  "Pillow==11.3.0",
  "APScheduler==3.11.0",
  "psutil==7.0.0",
  "tzlocal==5.3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
