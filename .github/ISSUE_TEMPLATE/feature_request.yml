name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem to solve}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed behavior}
    validations: {required: true}
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Web interface, Display rendering, Hardware support, Setup and installation, Plugin, Documentation, Other]
  - type: textarea
    id: testing
    attributes: {label: How should this be tested?}
