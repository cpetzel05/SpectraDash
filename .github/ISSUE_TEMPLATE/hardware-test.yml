name: Hardware test report
description: Report results for a physical e-paper display
title: "[Hardware] "
labels: [hardware, testing]
body:
  - type: input
    id: profile
    attributes: {label: SpectraDash display profile}
    validations: {required: true}
  - type: input
    id: model
    attributes: {label: Exact display model and revision}
    validations: {required: true}
  - type: input
    id: pi
    attributes: {label: Raspberry Pi model and OS}
    validations: {required: true}
  - type: textarea
    id: results
    attributes: {label: Test results, logs, photos, and required changes}
    validations: {required: true}
  - type: checkboxes
    id: checklist
    attributes:
      label: Validation
      options:
        - label: Preview rendered correctly
          required: true
        - label: Physical test pattern completed
          required: true
        - label: Ten scheduled refreshes completed
          required: true
        - label: Reboot recovery completed
          required: true
